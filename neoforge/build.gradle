plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    neoForge()
}

def developmentModClasses = "they_are_billions%%${sourceSets.main.output.resourcesDir.absolutePath}" + File.pathSeparator +
    "they_are_billions%%${sourceSets.main.output.classesDirs.asPath}"
def restartTestState = layout.buildDirectory.file("run/restartPersistence/restart-state").get().asFile.absolutePath
loom {

    runs {
        gameTestServer {
            environmentVars.put("MOD_CLASSES", developmentModClasses)
            server()
            name "NeoForge GameTest Server"
            vmArg "-Dneoforge.gameTestServer=true"
            vmArg "-Dneoforge.enabledGameTestNamespaces=they_are_billions"
            runDir "build/run/gameTestServer"
        }

        restartPersistenceSetup {
            environmentVars.put("MOD_CLASSES", developmentModClasses)
            server()
            name "NeoForge restart persistence setup"
            vmArg "-Dthey_are_billions.restart_test_phase=setup"
            vmArg "-Dthey_are_billions.restart_test_state=${restartTestState}"
            runDir "build/run/restartPersistence"
        }

        restartPersistenceVerify {
            environmentVars.put("MOD_CLASSES", developmentModClasses)
            server()
            name "NeoForge restart persistence verification"
            vmArg "-Dthey_are_billions.restart_test_phase=verify"
            vmArg "-Dthey_are_billions.restart_test_state=${restartTestState}"
            runDir "build/run/restartPersistence"
        }
    }
}

configurations {
    common
    shadowCommon // Don't use shadow from the shadow plugin since it *excludes* files.
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentNeoForge.extendsFrom common
}

dependencies {
    neoForge "net.neoforged:neoforge:${rootProject.neoforge_version}"
    modApi "dev.architectury:architectury-neoforge:${rootProject.architectury_version}"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionNeoForge")) { transitive false }
}

processResources {
    inputs.property "version", project.version

    filesMatching("META-INF/neoforge.mods.toml") {
        expand "version": project.version
    }
}

shadowJar {
    exclude "architectury.common.json"
    exclude "fabric.mod.json"

    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
}

remapJar {
    input.set shadowJar.archiveFile
    dependsOn shadowJar
}

sourcesJar {
    def commonSources = project(":common").sourcesJar
    dependsOn commonSources
    from commonSources.archiveFile.map { zipTree(it) }
}

components.java {
    withVariantsFromConfiguration(project.configurations.shadowRuntimeElements) {
        skip()
    }
}
