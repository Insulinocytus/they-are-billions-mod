name: Pull Request CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review, converted_to_draft]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect Changes
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
    steps:
      - name: Filter build changes
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            build:
              - 'build.gradle'
              - 'settings.gradle'
              - 'gradle.properties'
              - 'gradlew'
              - 'gradlew.bat'
              - 'gradle/**'
              - 'scripts/**'
              - 'common/**'
              - 'fabric/**'
              - 'neoforge/**'
              - '.github/workflows/ci.yml'

  verify:
    name: ${{ matrix.name }}
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Build
            command: ./gradlew build --no-parallel
          - name: Fabric GameTest
            command: ./gradlew :fabric:runGameTest --no-parallel
          - name: NeoForge GameTest
            command: ./gradlew :neoforge:runGameTestServer --no-parallel
          - name: Fabric Restart Persistence
            command: scripts/restart-persistence-test fabric
          - name: NeoForge Restart Persistence
            command: scripts/restart-persistence-test neoforge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}

  required-ci:
    name: Required CI
    needs: [changes, verify]
    if: always() && github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_CHANGED: ${{ needs.changes.outputs.build }}
          VERIFY_RESULT: ${{ needs.verify.result }}
        run: |
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "Change detection failed: $CHANGES_RESULT"
            exit 1
          fi

          case "$BUILD_CHANGED" in
            true)
              if [ "$VERIFY_RESULT" != "success" ]; then
                echo "Build verification failed: $VERIFY_RESULT"
                exit 1
              fi
              ;;
            false)
              if [ "$VERIFY_RESULT" != "skipped" ]; then
                echo "Build verification should be skipped: $VERIFY_RESULT"
                exit 1
              fi
              ;;
            *)
              echo "Unexpected build filter result: $BUILD_CHANGED"
              exit 1
              ;;
          esac
