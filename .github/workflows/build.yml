name: Build

on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit Tests
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Unit Tests
        run: ./gradlew :common:test --no-daemon --console=plain

  platform-validation:
    name: ${{ matrix.name }} Validation
    if: github.event_name == 'workflow_dispatch' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Fabric
            project: fabric
          - name: NeoForge
            project: neoforge
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Platform Build and JAR Packaging Checks
        run: ./gradlew :${{ matrix.project }}:build :${{ matrix.project }}:verifyJarPackaging --no-daemon --console=plain
      # FIXME: Replace this placeholder when Server Integration Tests are implemented.
      - name: Server Integration Tests
        run: echo "Server Integration Tests are not implemented yet."
      - name: Client Startup Smoke Tests
        timeout-minutes: 3
        shell: bash
        env:
          CLIENT_TASK: :${{ matrix.project }}:runClient
          PLATFORM: ${{ matrix.project }}
        run: |
          version=$(grep -E '^mod_version=' gradle.properties | cut -d= -f2)
          log="${PLATFORM}-client.log"
          xvfb-run --auto-servernum ./gradlew "${CLIENT_TASK}" --no-daemon --console=plain >"${log}" 2>&1 &
          pid=$!

          for _ in $(seq 1 120); do
            if grep -Fq "They Are Billions ${version} loaded" "${log}"; then
              kill "${pid}"
              wait "${pid}" || true
              exit 0
            fi
            if ! kill -0 "${pid}" 2>/dev/null; then
              cat "${log}"
              exit 1
            fi
            sleep 1
          done

          kill "${pid}" 2>/dev/null || true
          wait "${pid}" || true
          cat "${log}"
          exit 1
